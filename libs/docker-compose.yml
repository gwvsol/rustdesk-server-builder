services:

  rustdesk-server-hbbs:
    container_name: rustdesk-server-hbbs
    image: rustdesk-server:2026-01-24-00-trixie
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
      - 21118:21118
    command: hbbs -r help.itvsol.ru:21117
    depends_on:
      - rustdesk-server-hbbr
    restart: unless-stopped

  rustdesk-server-hbbr:
    container_name: rustdesk-server-hbbr
    image: rustdesk-server:2026-01-24-00-trixie
    ports:
      - 21117:21117
      - 21119:21119
    command: hbbr
    restart: unless-stopped
